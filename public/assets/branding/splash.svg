<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="splash-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>
    <linearGradient id="splash-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#splash-bg)" />
  <circle cx="400" cy="260" r="180" fill="#38bdf8" opacity="0.08" filter="blur(40px)" />
  <circle cx="400" cy="260" r="100" fill="#818cf8" opacity="0.12" filter="blur(30px)" />

  <!-- Centered Logo -->
  <g transform="translate(300, 160) scale(0.39)">
    <rect x="48" y="48" width="416" height="416" rx="108" fill="#0b0f19" stroke="rgba(255, 255, 255, 0.15)" stroke-width="3" />
    <g transform="translate(116, 126)">
      <ellipse cx="140" cy="130" rx="136" ry="60" transform="rotate(-28 140 130)" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="140 30 70 30" opacity="0.9" />
      <path d="M40 210 L40 70 C40 54 58 44 72 52 L140 98 L140 210 C140 220 128 226 120 220 L48 170 C43 166 40 160 40 154 Z" fill="#3b82f6" />
      <path d="M240 210 L240 70 C240 54 222 44 208 52 L140 98 L140 210 C140 220 152 226 160 220 L232 170 C237 166 240 160 240 154 Z" fill="#8b5cf6" />
      <path d="M140 50 L190 85 L140 120 L90 85 Z" fill="#06b6d4" />
      <circle cx="140" cy="155" r="14" fill="#38bdf8" />
      <circle cx="140" cy="155" r="6" fill="#ffffff" />
    </g>
  </g>

