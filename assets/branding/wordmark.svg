<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 120" width="100%" height="100%">
  <title>MyOS Wordmark</title>
  <!-- MyOS Executive Wordmark -->
  <!-- Left: Window Frame Icon Tile -->
  <g transform="translate(16, 16) scale(0.17)">
    <rect x="32" y="32" width="448" height="448" rx="64" fill="#14171D" stroke="#2D333F" stroke-width="4" />
    <rect x="56" y="56" width="400" height="400" rx="48" fill="#1E222A" stroke="#2D333F" stroke-width="3" />
    <line x1="56" y1="120" x2="456" y2="120" stroke="#2D333F" stroke-width="3" />
    <circle cx="96" cy="88" r="9" fill="#E06C38" />
    <circle cx="128" cy="88" r="9" fill="#2D333F" />
    <circle cx="160" cy="88" r="9" fill="#2D333F" />
    <!-- Stylized Geometric M Monogram -->
    <rect x="132" y="190" width="44" height="200" rx="12" fill="#ECEFF4" />
    <rect x="336" y="190" width="44" height="200" rx="12" fill="#ECEFF4" />
    <path d="M 176 190 L 256 318 L 224 340 L 158 234 Z" fill="#E06C38" />
    <path d="M 336 190 L 256 318 L 288 340 L 354 234 Z" fill="#E06C38" />
    <circle cx="256" cy="372" r="14" fill="#E06C38" stroke="#1E222A" stroke-width="3" />
  </g>

  <!-- Typography: MyOS -->
  <text x="124" y="66"
